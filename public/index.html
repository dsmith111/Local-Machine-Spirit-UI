<!doctype html>
<html lang="en" data-phosphor="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Cogitator</title>
  <meta name="description" content="Local Cogitator Interface: a chat terminal for your local agent.">
  <meta name="theme-color" content="#1d1811">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cogitator">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Share+Tech+Mono&family=VT323&display=swap">
  <link rel="stylesheet" href="styles.css?v=2026.11.08-r10">
</head>
<body>
  <div class="hood" aria-hidden="true"></div>
  <div class="foot" aria-hidden="true"></div>
  <div class="bezel">
    <header class="plate">
      <button class="icon-btn" id="btn-archives" aria-label="Open data-archives" title="Data-archives">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <div class="plate-title">
        <svg class="sigil" viewBox="0 0 64 64" aria-hidden="true"><use href="#cog-sigil"/></svg>
        <div>
          <h1 id="spirit-name">MACHINE SPIRIT</h1>
          <div class="sub"><span class="model-tag">Cogitator Terminal &middot; </span><span id="link-status" class="link unknown">Noosphere: probing</span></div>
        </div>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="Open configuration" title="Configuration">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
    </header>

    <main class="screen" id="screen">
      <div class="scanlines" aria-hidden="true"></div>
      <div class="flicker" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="log" id="log" role="log" aria-live="polite"></div>
    </main>

    <form class="console" id="composer" autocomplete="off">
      <div class="attachments" id="attachments" hidden></div>
      <div class="console-row">
        <label class="icon-btn attach" title="Attach pict-capture" aria-label="Attach image">
          <input type="file" id="file-input" accept="image/*" multiple hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="1.5"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2.5h5L16 6"/></svg>
        </label>
        <textarea id="input" rows="1" placeholder="Inscribe thy query…" enterkeyhint="send" aria-label="Message"></textarea>
        <button type="submit" class="transmit" id="btn-send" aria-label="Transmit">
          <span class="label">Transmit</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Data-archives drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Data-archives" hidden>
    <div class="drawer-head">
      <h2>Data-Archives</h2>
      <button class="icon-btn" id="btn-close-drawer" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="rite-btn wide" id="btn-new">+ Begin New Communion</button>
    <ul class="archive-list" id="archive-list"></ul>
    <p class="drawer-foot">Records are kept on this device. The machine spirit keeps its own.</p>
  </aside>

  <!-- Configuration -->
  <dialog id="settings">
    <form method="dialog" class="dialog-body" id="settings-form">
      <h2>Configuration Rites</h2>
      <label class="field" id="field-access">
        <span>Access cipher</span>
        <input type="password" id="set-access" autocomplete="current-password" placeholder="As set in COGITATOR_ACCESS_CODE">
      </label>
      <label class="field">
        <span>Spirit designation</span>
        <input type="text" id="set-name" maxlength="32" placeholder="MACHINE SPIRIT">
      </label>
      <label class="field">
        <span>Phosphor</span>
        <select id="set-phosphor">
          <option value="green">Viridian (green)</option>
          <option value="amber">Auric (amber)</option>
          <option value="crimson">Sanguine (crimson)</option>
          <option value="ice">Glacial (pale blue)</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="set-ritual"> <span>Ritual speech &mdash; ask the spirit to answer in the manner of a machine spirit</span></label>
      <label class="field">
        <span>Additional litany (system prompt, optional)</span>
        <textarea id="set-system" rows="3" placeholder="Layered on top of the agent's own instructions."></textarea>
      </label>
      <label class="check"><input type="checkbox" id="set-reasoning" checked> <span>Reveal the spirit's deliberations (reasoning)</span></label>
      <label class="check"><input type="checkbox" id="set-fx" checked> <span>Cathode effects (scanlines &amp; flicker)</span></label>
      <label class="check"><input type="checkbox" id="set-boot" checked> <span>Rite of awakening on launch</span></label>
      <fieldset class="summon">
        <legend>Summonings &middot; notifications</legend>
        <p class="push-status" id="push-status" aria-live="polite"></p>
        <div class="push-actions">
          <button type="button" class="rite-btn grant" id="btn-push-toggle" hidden>Enable summonings</button>
          <button type="button" class="rite-btn ghost" id="btn-push-test" hidden>Send test</button>
        </div>
        <p class="push-hint">Summon this device when it is away and&hellip;</p>
        <label class="check"><input type="checkbox" id="push-answers" checked> <span>the spirit has answered</span></label>
        <label class="check"><input type="checkbox" id="push-sanctions" checked> <span>a sanction (approval) is required</span></label>
        <label class="check"><input type="checkbox" id="push-faults" checked> <span>a rite ends in fault</span></label>
        <label class="check"><input type="checkbox" id="push-proclamations" checked> <span>a proclamation arrives (reminders, reports, messages via Discord)</span></label>
        <label class="check"><input type="checkbox" id="push-previews" checked> <span>include message previews</span></label>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="rite-btn danger" id="btn-purge">Purge Archives</button>
        <span class="spacer"></span>
        <button value="cancel" class="rite-btn ghost">Dismiss</button>
        <button value="save" class="rite-btn" id="btn-save-settings">Sanctify</button>
      </div>
      <p class="build-tag">Cogitator build <span id="build-tag"></span></p>
    </form>
  </dialog>

  <!-- Shared SVG symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cog-sigil" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
        <path d="M29 4h6l1.2 6.2a22 22 0 0 1 5.6 2.3l5.2-3.6 4.2 4.2-3.6 5.2a22 22 0 0 1 2.3 5.6L56 29v6l-6.2 1.2a22 22 0 0 1-2.3 5.6l3.6 5.2-4.2 4.2-5.2-3.6a22 22 0 0 1-5.6 2.3L35 56h-6l-1.2-6.2a22 22 0 0 1-5.6-2.3L17 51.1 12.9 47l3.6-5.2a22 22 0 0 1-2.3-5.6L8 35v-6l6.2-1.2a22 22 0 0 1 2.3-5.6L12.9 17 17 12.9l5.2 3.6a22 22 0 0 1 5.6-2.3z"/>
        <circle cx="32" cy="32" r="12"/>
      </g>
      <circle cx="32" cy="32" r="5" fill="currentColor"/>
      <path d="M20 32h-4M48 32h-4M32 20v-4M32 48v-4" stroke="currentColor" stroke-width="2"/>
    </symbol>
  </svg>

  <script src="markdown.js?v=2026.11.08-r10"></script>
  <script src="app.js?v=2026.11.08-r10"></script>
</body>
</html>
